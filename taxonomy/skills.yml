# Canonical skill taxonomy. Categories group skills for reporting;
# the extractor matches each skill (and its aliases) with word-boundary,
# case-sensitive-where-noted matching. Add freely — aliases live in skill_aliases.yml.
#
# `match` overrides the default pattern (the skill name itself) when the name is
# ambiguous in prose. `case_sensitive: true` is for short acronyms like "Go" or "R".

Programming:
  - Python
  - Java
  - JavaScript
  - TypeScript
  - PHP
  - name: Go
    case_sensitive: true
    match: "Go(?:lang)?"
  - Rust
  - "C#"
  - "C++"
  - Ruby
  - Bash
  - Node.js
  - React
  - Vue.js
  - Laravel
  - Symfony

